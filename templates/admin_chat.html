{% extends "base.html" %}{% block content %}<h1>Customer Support</h1><div class="grid two"><div class="card">{% for u in users %}<a class="user" href="/admin/chat?user_id={{u.id}}"><b>{{u.name}}</b><small>{{u.email}}</small></a>{% else %}<p>No chats yet.</p>{% endfor %}</div><div class="card">{% if uid %}<div class="messages">{% for m in msgs %}<div class="msg {{m.sender}}"><b>{{m.sender}}</b><p>{{m.message}}</p></div>{% endfor %}</div><form method="post" class="row"><input type="hidden" name="user_id" value="{{uid}}"><input name="message" placeholder="Reply..." required><button class="btn">Send</button></form>{% else %}<p>Select a customer.</p>{% endif %}</div></div>{% endblock %}
